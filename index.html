    <meta property="og:title" content="Construction Project Dashboard" />
    <meta property="og:description" content="A comprehensive construction project monitoring dashboard linked with Google Sheets, supporting multiple fiscal years, plans, projects, contract details, and visual progress tracking." />
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        if (message === 'Script error.' || message === 'Script error' || (!source && !lineno)) {
          console.warn('Cross-origin script error suppressed:', message);
          return true;
        }
        return false;
      };
      window.addEventListener('error', function(event) {
        if (event.message === 'Script error.' || event.message === 'Script error' || (!event.filename && !event.lineno)) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (event.reason.message === 'Script error.' || String(event.reason).includes('Script error'))) {
          event.preventDefault();
        }
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
